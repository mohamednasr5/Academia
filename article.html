<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b7f34a">
  <title>تفاصيل الخبر | أكاديمية مركز شباب الأحمدية</title>
  <meta name="description" content="تفاصيل خبر من أخبار أكاديمية مركز شباب الأحمدية لكرة القدم.">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./images/icons/favicon.ico">
  <link rel="apple-touch-icon" href="./images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .article-page-wrap { padding: 40px 0 80px; }
    .article-card-main {
      background: linear-gradient(145deg, rgba(17,39,29,0.96), rgba(9,22,17,0.97));
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-2xl);
      overflow: hidden;
      padding: 30px 22px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: var(--shadow-lg);
    }
    @media (min-width: 768px) { .article-card-main { padding: 48px 40px; } }
    .article-cover-img {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      border: 2px solid var(--gold-primary);
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
    }
    .article-title-main {
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 900;
      line-height: 1.35;
      color: var(--text-white);
      margin-bottom: 20px;
    }
    .article-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .article-body-text { color: #d8e3d9; font-size: 1.1rem; line-height: 2; margin-bottom: 36px; }
    .article-body-text p { margin-bottom: 18px; }
    .article-share-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 14px; padding: 20px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-md);
    }
    .share-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 700; text-decoration: none;
      color: #fff; transition: var(--transition); cursor: pointer; border: none;
    }
    .share-wa { background: #25d366; }
    .share-fb { background: #1877f2; }
    .share-copy { background: rgba(183,243,74,0.12); border: 1px solid var(--border-gold); color: var(--gold-light); }
    .share-btn:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn-back-home {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gold-light); font-weight: 700; font-size: 0.92rem;
      margin-bottom: 22px; transition: var(--transition);
    }
    .btn-back-home:hover { color: var(--gold-primary); transform: translateX(4px); }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container header-container">
      <a href="./index.html" class="brand-wrap">
        <img src="./images/logo.jpg" alt="شعار الأكاديمية" class="brand-logo" width="52" height="52">
        <div class="brand-text">
          <h1>أكاديمية مركز شباب الأحمدية</h1>
          <span>صناع الأبطال ونجوم المستقبل</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="./index.html#news" class="btn-outline-gold" style="padding:9px 15px;font-size:0.85rem;"><span>←</span> العودة للأخبار</a>
      </div>
    </div>
  </header>

  <main class="article-page-wrap">
    <div class="container">
      <div style="max-width:900px;margin:0 auto;">
        <a href="./index.html#news" class="btn-back-home"><span>←</span> العودة لجميع أخبار الأكاديمية</a>
      </div>
      <article class="article-card-main" id="article-content-container">
        <div class="skeleton skeleton-card" style="min-height:300px;"></div>
      </article>

      <section style="max-width:900px;margin:46px auto 0;">
        <div class="section-title-wrap" style="margin-bottom:24px;text-align:right;">
          <h3 style="font-size:1.3rem;color:var(--gold-light);">📌 أخبار وتقارير أخرى قد تهمك</h3>
        </div>
        <div class="news-grid" id="related-news-container"></div>
      </section>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container" style="display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center;text-align:center;">
      <p style="color:var(--text-muted);font-size:0.84rem;">جميع الحقوق محفوظة © <span id="footer-year">2026</span> لأكاديمية مركز شباب الأحمدية لكرة القدم</p>
      <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;color:var(--gold-light);flex-wrap:wrap;justify-content:center;">
        <span>💻 برمجة وتطوير: <strong style="color:#fff;">المهندس محمد حماد</strong></span>
      </div>
    </div>
  </footer>

  <nav class="mobile-bottom-nav" aria-label="التنقل السريع">
    <a href="./index.html#home" class="mobile-nav-item"><span class="icon">🏠</span><span>الرئيسية</span></a>
    <a href="./index.html#matches" class="mobile-nav-item"><span class="icon">⚽</span><span>المباريات</span></a>
    <a href="./index.html#register" class="mobile-nav-item highlight-nav"><span class="icon">✍️</span><span>تقديم</span></a>
    <a href="./index.html#news" class="mobile-nav-item active"><span class="icon">📰</span><span>الأخبار</span></a>
    <a href="./admin.html" class="mobile-nav-item"><span class="icon">⚙️</span><span>الإدارة</span></a>
  </nav>

  <script type="module" src="./js/article.js"></script>
</body>
</html>
